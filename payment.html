<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Lightning - LightWork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary-color: #f2a900;
            --secondary-color: #4d4d4e;
            --background-color: #1a1a1a;
            --text-color: #ffffff;
            --card-color: #2a2a2a;
            --accent-color: #00c3ff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
        }
        
        header {
            background: linear-gradient(to right, rgba(74, 74, 74, 0.8), rgba(26, 26, 26, 0.8));
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: background 0.3s ease;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            color: var(--primary-color);
            font-size: 1.5em;
            font-weight: bold;
            text-decoration: none;
        }
        
        nav {
            background: none;
        }
        
        nav a {
            color: var(--text-color);
            padding: 10px 15px;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 5px;
        }
        
        nav a:hover {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            transform: translateY(-3px);
        }
        
        .container {
            max-width: 600px;
            margin: 80px auto 20px;
            padding: 20px;
            background-color: var(--card-color);
            box-shadow: 0 0 20px rgba(242, 169, 0, 0.1);
            border-radius: 10px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            color: var(--primary-color);
        }
        
        .payment-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        
        .payment-form input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            background-color: var(--card-color);
            color: var(--text-color);
        }
        
        .lightning-icon {
            font-size: 48px;
            color: var(--accent-color);
            text-align: center;
            margin: 20px 0;
        }
        
        .submit-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--background-color);
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .submit-btn:hover {
            background-color: #00e6ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 195, 255, 0.4);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading i {
            font-size: 48px;
            color: var(--accent-color);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        footer {
            background-color: rgba(77, 77, 78, 0.9);
            color: var(--text-color);
            text-align: center;
            padding: 5px 0;
            position: fixed;
            bottom: -30px;
            width: 100%;
            transition: bottom 0.3s ease;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <a href="#" class="logo"><i class="fab fa-bitcoin"></i> LightWork</a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="jobs.html">Ofertas de Trabajo</a>
            <a href="freelancers.html">Freelancers</a>
            <a href="chat.html">Chat</a>
            <a href="payment.html">Pago</a>
        </nav>
    </div>
</header>
<div class="container">
    <section id="payment" class="section">
        <h2>Pago con Lightning Network</h2>
        <div class="lightning-icon">
            <i class="fas fa-bolt"></i>
        </div>
        <form class="payment-form" id="payment-form">
            <label for="invoice">Factura Lightning</label>
            <input type="text" id="invoice" placeholder="lnbc1..." required>
            
            <label for="amount">Monto (satoshis)</label>
            <input type="number" id="amount" placeholder="1000" required>
            
            <button type="submit" class="submit-btn">Pagar con Lightning</button>
        </form>
        <div class="loading" id="loading">
            <i class="fas fa-circle-notch"></i>
            <p>Procesando pago Lightning...</p>
        </div>
    </section>
</div>
<footer>
    <p>&copy; 2024 LightWork. Todos los derechos reservados.</p>
</footer>

<script>
    const form = document.getElementById('payment-form');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        form.style.display = 'none';
        loading.style.display = 'block';
        
        setTimeout(function() {
            loading.style.display = 'none';
            alert('Pago Lightning procesado con éxito');
            form.reset();
            form.style.display = 'block';
        }, 3000);
    });

    // Efecto de cabecera al hacer scroll
    window.addEventListener('scroll', function() {
        const header = document.querySelector('header');
        if (window.scrollY > 50) {
            header.style.background = 'rgba(26, 26, 26, 0.9)';
        } else {
            header.style.background = 'linear-gradient(to right, rgba(74, 74, 74, 0.8), rgba(26, 26, 26, 0.8))';
        }
    });

    // Revelar pie de página al llegar al final
    let lastScrollTop = 0;
    window.addEventListener('scroll', function() {
        const footer = document.querySelector('footer');
        let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        if (scrollTop > lastScrollTop) {
            // Scroll hacia abajo
            if ((window.innerHeight + scrollTop) >= document.body.offsetHeight - 50) {
                footer.style.bottom = '0';
            }
        } else {
            // Scroll hacia arriba
            footer.style.bottom = '-30px';
        }
        lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
    }, false);
</script>
</body>
</html>
